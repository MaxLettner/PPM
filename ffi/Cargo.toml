[package]
name = "peerpass-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "peerpass_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
peerpass-core = { path = "../core" }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
uuid = "1"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
