<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --muted: #777; --hover: rgba(127,127,127,.15); }
  body { font: 13px system-ui, sans-serif; margin: 0; min-width: 300px; max-width: 380px; }
  header { padding: 8px 10px; font-weight: 600; border-bottom: 1px solid var(--hover); }
  #msg { padding: 12px 10px; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; }
  .item:hover { background: var(--hover); }
  .who { flex: 1; min-width: 0; cursor: pointer; }
  .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }
  button { font: inherit; }
</style>
</head>
<body>
<header id="site">peerpass</header>
<div id="msg">Loading…</div>
<div id="list"></div>
<script src="popup.js"></script>
</body>
</html>
